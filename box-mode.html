<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css intro</title>
</head>
<body>


    <h1 style="width: 500px; height: 200px;
                border-top: 2px;
                border-right: 2px;
                border-bottom: 2px;
                border-left: 2px;
                border-style: solid;
                border-color: red;
                padding: 20px;">
        introducción a las hojas de estilo en cascada CSS (cascading style sheets) 
    </h1>
    <!-- si quieres aprender más sobre CSS, visita la página de <a href="https://developer.mozilla.org/es/docs/Web/CSS">MDN Web Docs</a> -->

    <!-- para dar un valor numerico a los atributos (border...) los escribes solos sin el guion- mas la segunda palabra.
     si quieres poner distintos valores pon border-width -->
    <h1 style="width: 250px; height: 125px; 
                border-width: 20px 40px;
                border-style: solid;
                border-color: blue;
                padding: 20px;">
        Otro elemento HTML para comparar
    </h1>



</body>
</html>
